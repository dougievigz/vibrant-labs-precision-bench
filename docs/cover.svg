<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#F3F3F3"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0142E2" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- brand row -->
  <g transform="translate(80,76)">
    <rect width="34" height="34" rx="8" fill="#0142E2"/>
    <circle cx="17" cy="17" r="8" fill="none" stroke="#F3F3F3" stroke-width="2.6"/>
    <circle cx="17" cy="17" r="2.6" fill="#F3F3F3"/>
    <text x="50" y="25" font-family="'Roboto Mono',monospace" font-size="20" letter-spacing="7" font-weight="600" fill="#161616">VIBRANT</text>
  </g>

  <!-- headline -->
  <text x="78" y="250" font-size="118" font-weight="600" letter-spacing="-4" fill="#161616">Precision Bench</text>

  <!-- subtitle -->
  <text x="82" y="300" font-size="24" fill="#2b2b2b">Route every biomarker to the analyzer that can actually run it.</text>
  <text x="82" y="334" font-size="24" fill="#2b2b2b">Right molecule, right specimen, right machine.</text>

  <!-- analyzer chips -->
  <g transform="translate(82,400)" font-family="'Roboto Mono',monospace" font-size="15" font-weight="600" letter-spacing="1">
    <g transform="translate(0,0)">
      <rect width="172" height="58" rx="12" fill="#fff" stroke="#d9d9d9"/>
      <rect width="172" height="4" y="54" rx="2" fill="#3A85FF"/>
      <circle cx="20" cy="20" r="5" fill="#3A85FF"/>
      <text x="34" y="25" fill="#161616">IMMUNOCHIP</text>
      <text x="20" y="44" font-size="11" fill="#5a5a5a" letter-spacing="0.5">ANTIBODIES</text>
    </g>
    <g transform="translate(188,0)">
      <rect width="150" height="58" rx="12" fill="#fff" stroke="#d9d9d9"/>
      <rect width="150" height="4" y="54" rx="2" fill="#00B591"/>
      <circle cx="20" cy="20" r="5" fill="#00B591"/>
      <text x="34" y="25" fill="#161616">LC-MS/MS</text>
      <text x="20" y="44" font-size="11" fill="#5a5a5a" letter-spacing="0.5">SMALL MOLECULES</text>
    </g>
    <g transform="translate(352,0)">
      <rect width="132" height="58" rx="12" fill="#fff" stroke="#d9d9d9"/>
      <rect width="132" height="4" y="54" rx="2" fill="#67E78D"/>
      <circle cx="20" cy="20" r="5" fill="#67E78D"/>
      <text x="34" y="25" fill="#161616">ICP-MS</text>
      <text x="20" y="44" font-size="11" fill="#5a5a5a" letter-spacing="0.5">METALS</text>
    </g>
    <g transform="translate(498,0)">
      <rect width="150" height="58" rx="12" fill="#fff" stroke="#d9d9d9"/>
      <rect width="150" height="4" y="54" rx="2" fill="#F1B669"/>
      <circle cx="20" cy="20" r="5" fill="#F1B669"/>
      <text x="34" y="25" fill="#161616">PCR · NGS</text>
      <text x="20" y="44" font-size="11" fill="#5a5a5a" letter-spacing="0.5">DNA / RNA</text>
    </g>
    <g transform="translate(662,0)">
      <rect width="132" height="58" rx="12" fill="#fff" stroke="#d9d9d9"/>
      <rect width="132" height="4" y="54" rx="2" fill="#81E4FF"/>
      <circle cx="20" cy="20" r="5" fill="#81E4FF"/>
      <text x="34" y="25" fill="#161616">ELISA</text>
      <text x="20" y="44" font-size="11" fill="#5a5a5a" letter-spacing="0.5">GI PROTEINS</text>
    </g>
    <g transform="translate(808,0)">
      <rect width="172" height="58" rx="12" fill="#fff" stroke="#d9d9d9"/>
      <rect width="172" height="4" y="54" rx="2" fill="#FF490D"/>
      <circle cx="20" cy="20" r="5" fill="#FF490D"/>
      <text x="34" y="25" fill="#161616">CHEM · HEME</text>
      <text x="20" y="44" font-size="11" fill="#5a5a5a" letter-spacing="0.5">CHEMISTRY</text>
    </g>
  </g>

  <text x="82" y="520" font-family="'Roboto Mono',monospace" font-size="13" letter-spacing="2" fill="#5a5a5a">AN EDUCATIONAL LAB-ROUTING GAME · VIBRANT WELLNESS</text>
</svg>
